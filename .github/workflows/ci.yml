name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://example.com
      SITE_URL: https://example.com
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder
      TBC_CHECKOUT_ENABLED: "false"
      NEXT_PUBLIC_FLITT_PAYMENTS_ENABLED: "false"
      FLITT_MODE: test
      FLITT_MERCHANT_ID: "424242"
      FLITT_SECRET_KEY: "unit-test-only-signing-key"
      FLITT_API_URL: "https://sandbox-payments.invalid"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/build-with-public-fixture.mjs
