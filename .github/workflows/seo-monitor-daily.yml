name: SamoSell SEO Daily Health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches:
      - main
      - preview/seo-monitor-diff-20261011
    paths:
      - .github/workflows/seo-monitor-daily.yml
      - scripts/seo_monitor.py
      - scripts/seo_restore_previous.py
      - scripts/test_seo_monitor.py
permissions:
  contents: read
concurrency:
  group: seo-health-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/seo_monitor.py scripts/seo_restore_previous.py scripts/test_seo_monitor.py
      - name: Test SEO monitor and artifact restoration
        run: python3 -m unittest discover -s scripts -p 'test_seo_monitor.py' -v
  seo-health:
    # Google WIF remains limited to the existing main production monitoring job.
    if: github.ref == 'refs/heads/main'
    needs: validate-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore previous successful main snapshot (if available)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/seo_restore_previous.py
      - name: Google OIDC authentication
        id: auth
        # The monitor must still publish explicit authentication errors.
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
      - name: Run read-only SEO checks
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/seo_monitor.py
      - name: Publish human-readable report
        if: always()
        run: |
          if [ -f seo-monitor-output/report.md ]; then
            cat seo-monitor-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Store report and baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seo-snapshot
          path: seo-monitor-output/
          retention-days: 90
          if-no-files-found: error
