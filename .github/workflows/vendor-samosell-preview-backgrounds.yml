name: Vendor SamoSell preview backgrounds

on:
  push:
    branches:
      - preview/logo-samo-yellow-sell
    paths:
      - .github/workflows/vendor-samosell-preview-backgrounds.yml

permissions:
  contents: write

jobs:
  vendor-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/logo-samo-yellow-sell
          fetch-depth: 0

      - name: Download approved background assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/brand
          curl -L --fail --retry 3 --retry-delay 2 'https://lh7-us.googleusercontent.com/docsdf/AFQj2d4mCKulTlNBBLEa_51H2fZHLQnwFJgUPItXH1lItGvmOIRvgSaMfMIB97WmJbfcITMDB6Fkpj4nJKd-rCgR9MQ0YpriMnBOII1c6NzSRfe13n0DgBooP13Wlv4QWUfE7iQKabLFftjOD4qLimdlUVQ5_gnUlg3EOJeDayLIFiGOZjZa=s1600' -o public/brand/samosell-hero-bg.jpg
          curl -L --fail --retry 3 --retry-delay 2 'https://lh7-us.googleusercontent.com/docsdf/AFQj2d7l9ZcdIfDlgsPXlieRHHQTMhbMqJPoUY9Pn_UJWrHeBQrIkx3TsuC1gm-y0B7NRNebXqtYyAbTKZ8JrmSLBttMXj5YYX6cZB8Z0PI-_Sjc2wLWESejLyWitkg-ANcoMFtEL9oLH-2Th7CEItd4IBBSWGIeCa0RiFh2XILuDxGclezJ=s1600' -o public/brand/samosell-ad-bg.jpg
          curl -L --fail --retry 3 --retry-delay 2 'https://lh7-us.googleusercontent.com/docsdf/AFQj2d5_SlVGNXu_2Lz6sOPEjR-eNWy4TJLy5U0rxjr-5ZZ0vsTnoVniPB7uHLofPlnlXmxR-T9cM5nTYedzuGqAXuFrpde3j34mzB4BGguaxfSRQ4RJpKfyYAF_Zm7ak0D6lAAho7QjlO0dCFMdC24mILKc07eZfseOnQZUdCFJioxYExJv=s1600' -o public/brand/samosell-promo-bg.jpg

          test "$(wc -c < public/brand/samosell-hero-bg.jpg)" -gt 50000
          test "$(wc -c < public/brand/samosell-ad-bg.jpg)" -gt 30000
          test "$(wc -c < public/brand/samosell-promo-bg.jpg)" -gt 30000

      - name: Point components to local assets
        shell: python
        run: |
          from pathlib import Path
          import re

          updates = {
              "components/home/HomeSearchHeroSection.tsx": "/brand/samosell-hero-bg.jpg",
              "components/ads/AdPlaceholder.tsx": "/brand/samosell-ad-bg.jpg",
              "components/home/HomePromoBanner.tsx": "/brand/samosell-promo-bg.jpg",
          }

          pattern = re.compile(r'style=\{\{ backgroundImage: "url\(\'[^\']+\'\)" \}\}')

          for filename, local_path in updates.items():
              path = Path(filename)
              text = path.read_text()
              replacement = f'''style={{{{ backgroundImage: "url('{local_path}')" }}}}'''
              new_text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"Expected one backgroundImage replacement in {filename}, got {count}")
              path.write_text(new_text)

      - name: Commit local background assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/samosell-hero-bg.jpg public/brand/samosell-ad-bg.jpg public/brand/samosell-promo-bg.jpg \
                  components/home/HomeSearchHeroSection.tsx components/ads/AdPlaceholder.tsx components/home/HomePromoBanner.tsx
          git diff --cached --stat
          git commit -m "Vendor SamoSell preview backgrounds as local assets"
          git push origin HEAD:preview/logo-samo-yellow-sell
